<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#12263a"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4dd0e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#glow)"/>

  <!-- decorative aisle lines -->
  <g stroke="#4dd0e1" stroke-opacity="0.12" stroke-width="2">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="330" x2="1200" y2="330"/>
  </g>

  <!-- floating shelf-like rectangles, low opacity -->
  <g fill="none" stroke="#8ee6f0" stroke-opacity="0.15">
    <rect x="60" y="60" width="140" height="18" rx="3"/>
    <rect x="60" y="100" width="140" height="18" rx="3"/>
    <rect x="1000" y="60" width="140" height="18" rx="3"/>
    <rect x="1000" y="100" width="140" height="18" rx="3"/>
  </g>

  <!-- sparkle circles representing "clean" shine -->
  <g fill="#ffffff" opacity="0.08">
    <circle cx="150" cy="200" r="60"/>
    <circle cx="1050" cy="230" r="80"/>
    <circle cx="600" cy="40" r="30"/>
  </g>

  <!-- broom-like sweep path, decorative -->
  <path d="M 100 300 Q 300 260 500 300 T 900 300 T 1100 300"
        fill="none" stroke="#4dd0e1" stroke-opacity="0.15" stroke-width="3"/>

  <!-- subtle diagonal shine -->
  <path d="M -50 0 L 300 0 L 100 360 L -250 360 Z" fill="url(#sparkle)"/>

  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58.0" fill="#ffffff" font-weight="bold">
    <tspan x="600" dy="0">Clean Supermarket!</tspan>
    <tspan x="600" dy="66">Script</tspan>
  </text>

  <text x="600" y="270" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22.0" fill="#c9d1d9">
    Small Windows tool for Clean the Supermarket!
  </text>
</svg>